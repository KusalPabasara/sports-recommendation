name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Build frontend
        working-directory: app/frontend
        run: npm run build

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "=== Pulling latest code ==="
            cd /opt/sports-rec
            git checkout -- .
            git pull origin main

            echo "=== Installing Python dependencies ==="
            venv/bin/pip install -r app/backend/requirements.txt -q

            echo "=== Restarting API service ==="
            systemctl restart sports-rec
            sleep 3
            systemctl is-active --quiet sports-rec && echo "Service OK" || (journalctl -u sports-rec -n 20 && exit 1)

      - name: Upload built frontend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: app/frontend/dist/
          target: /opt/sports-rec/
          strip_components: 2

      - name: Reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            nginx -t && systemctl reload nginx
            echo "=== Nginx reloaded ==="

      - name: Health check
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://gmora.dev/api/health)
          if [ "$STATUS" = "200" ]; then
            echo "Health check passed — https://gmora.dev is live"
          else
            echo "Health check FAILED — HTTP $STATUS"
            exit 1
          fi
