name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_ytJ5wFZI6EyQFfGofB5Iqlcn
      VERCEL_PROJECT_ID: prj_5xUAqLKzfxk6S2klm3wvyLSHue4c
      VERCEL_SUPPORT_LARGE_FUNCTIONS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python package manager
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"

      - name: Install Vercel CLI
        run: npm install --global vercel@58.4.4

      - name: Pull Vercel production settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build for Vercel
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
