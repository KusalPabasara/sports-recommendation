<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#D4AF37" stroke-width="0.4" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0A0A"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Border frame -->
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.35"/>
  <rect x="34" y="34" width="1132" height="562" fill="none" stroke="#D4AF37" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- Corner brackets — top left -->
  <path d="M24,64 L24,24 L64,24" fill="none" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.8"/>
  <!-- Corner brackets — top right -->
  <path d="M1136,24 L1176,24 L1176,64" fill="none" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.8"/>
  <!-- Corner brackets — bottom left -->
  <path d="M24,566 L24,606 L64,606" fill="none" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.8"/>
  <!-- Corner brackets — bottom right -->
  <path d="M1136,606 L1176,606 L1176,566" fill="none" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Diamond logo mark -->
  <rect x="576" y="98" width="48" height="48" fill="#D4AF37" transform="rotate(45 600 122)" opacity="0.9"/>
  <rect x="582" y="104" width="36" height="36" fill="#0A0A0A" transform="rotate(45 600 122)"/>
  <text x="600" y="130" font-family="Georgia, serif" font-size="18" fill="#D4AF37" text-anchor="middle" font-weight="bold">S</text>

  <!-- Conference badge -->
  <rect x="458" y="155" width="284" height="28" fill="none" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.5" rx="0"/>
  <text x="600" y="174" font-family="Arial, sans-serif" font-size="11" fill="#D4AF37" text-anchor="middle" letter-spacing="4" opacity="0.85">ACCEPTED · ICDSIAI-26</text>

  <!-- Main headline -->
  <text x="600" y="258" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#F2F0E4" text-anchor="middle" letter-spacing="6" font-weight="normal">SPORTREC</text>

  <!-- Gold divider -->
  <line x1="480" y1="284" x2="562" y2="284" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.6"/>
  <rect x="596" y="278" width="8" height="8" fill="#D4AF37" transform="rotate(45 600 282)" opacity="0.9"/>
  <line x1="638" y1="284" x2="720" y2="284" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Subheading -->
  <text x="600" y="330" font-family="Arial, sans-serif" font-size="22" fill="#D4AF37" text-anchor="middle" letter-spacing="8" font-weight="normal">DISCOVER YOUR PERFECT SPORT</text>

  <!-- Body text -->
  <text x="600" y="382" font-family="Arial, sans-serif" font-size="16" fill="#888888" text-anchor="middle" letter-spacing="1">AI-powered · XGBoost + Random Forest stacking ensemble · 20 sports</text>

  <!-- Three feature pillars -->
  <!-- Pillar 1 -->
  <rect x="190" y="430" width="230" height="84" fill="#141414" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.3"/>
  <rect x="297" y="420" width="12" height="12" fill="#D4AF37" transform="rotate(45 303 426)" opacity="0.8"/>
  <text x="305" y="463" font-family="Arial, sans-serif" font-size="12" fill="#D4AF37" text-anchor="middle" letter-spacing="3">INTEREST-DRIVEN</text>
  <text x="305" y="482" font-family="Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">Your passions shape results</text>
  <text x="305" y="499" font-family="Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">not just athletic metrics</text>

  <!-- Pillar 2 -->
  <rect x="485" y="430" width="230" height="84" fill="#141414" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.3"/>
  <rect x="592" y="420" width="12" height="12" fill="#D4AF37" transform="rotate(45 598 426)" opacity="0.8"/>
  <text x="600" y="463" font-family="Arial, sans-serif" font-size="12" fill="#D4AF37" text-anchor="middle" letter-spacing="3">STACKING ENSEMBLE</text>
  <text x="600" y="482" font-family="Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">XGBoost + Random Forest</text>
  <text x="600" y="499" font-family="Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">17.4% NDCG improvement</text>

  <!-- Pillar 3 -->
  <rect x="780" y="430" width="230" height="84" fill="#141414" stroke="#D4AF37" stroke-width="0.8" stroke-opacity="0.3"/>
  <rect x="887" y="420" width="12" height="12" fill="#D4AF37" transform="rotate(45 893 426)" opacity="0.8"/>
  <text x="895" y="463" font-family="Arial, sans-serif" font-size="12" fill="#D4AF37" text-anchor="middle" letter-spacing="3">SPORT DISCOVERY</text>
  <text x="895" y="482" font-family="Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">Cosine similarity novelty</text>
  <text x="895" y="499" font-family="Arial, sans-serif" font-size="11" fill="#666666" text-anchor="middle">85.7% novelty rate</text>

  <!-- URL -->
  <text x="600" y="590" font-family="Arial, sans-serif" font-size="13" fill="#D4AF37" text-anchor="middle" letter-spacing="3" opacity="0.6">sports-recommendation.vercel.app</text>
</svg>
